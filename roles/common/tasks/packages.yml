---
# Install extra packages. Repo-gated packages (1Password, HashiCorp tools) are
# split into separate tasks below so a missing/unsupported third-party repo
# doesn't fail the whole base install.
- name: Install base packages
  ansible.builtin.apt:
    name:
      - direnv
      - fail2ban
      - arpwatch
      - autoconf
      - autofs
      - automake
      - bat
      - build-essential
      - cmake
      - curl
      - ufw
      - golang
      - gh
      - htop
      - iotop
      - jq
      - lshw
      - lsscsi
      - nfs-common
      - ngrep
      - nmap
      - nmon
      - npm
      - ripgrep
      - speedtest-cli
      - sysstat
      - tmux
      - neovim
      - python3-psutil
      - python3-pip
      - python3-termcolor
      - unzip
      - util-linux
    state: present
    cache_valid_time: 3600
  become: true

# Desktop-only extras: GUI apps + the GNOME configuration tooling.
# alacritty intentionally NOT here: Ubuntu 24.04 ships 0.13.2, but our
# alacritty.toml uses the [terminal] / [general] sections introduced in
# 0.14. We install alacritty from ppa:aslatter/ppa in the third-party
# alacritty role instead.
- name: Install desktop extras
  ansible.builtin.apt:
    name:
      - dconf-editor
      - transmission
      - mpv
      - celluloid
      - nextcloud-desktop
      - gnome-extensions-app
      - gnome-tweaks
    state: present
    cache_valid_time: 3600
  become: true
  when: install_desktop_extras | default(true)

- name: Install 1Password (only if its apt repo was added)
  ansible.builtin.apt:
    name: 1password
    state: present
    cache_valid_time: 3600
  become: true
  when: common_onepassword_repo_available | default(false)

- name: Install HashiCorp tools (only if its apt repo was added)
  ansible.builtin.apt:
    name:
      - terraform
      - vault
      - consul
      - nomad
      - packer
    state: present
    cache_valid_time: 3600
  become: true
  when: common_hashicorp_repo_available | default(false)

# Install full ffmpeg (Ubuntu's universe ffmpeg replaces Fedora's swap dance).
# ffmpeg itself is CLI-useful; libva2/vainfo pull in the GPU stack for hardware
# video accel, which is only meaningful on a desktop.
- name: Install ffmpeg
  ansible.builtin.apt:
    name: ffmpeg
    state: present
  become: true

- name: Install VA-API packages
  ansible.builtin.apt:
    name:
      - libva2
      - vainfo
    state: present
  become: true
  when: install_desktop_extras | default(true)

# Keep ALSA output nodes from suspending. Intel SOF DSP (e.g. Lunar Lake) takes
# several seconds to wake from suspend, which surfaces as a 3-6s audio dropout
# when launching a media player after the device has been idle.
- name: Ensure WirePlumber drop-in config directory exists
  ansible.builtin.file:
    path: /etc/wireplumber/wireplumber.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: install_desktop_extras | default(true)

- name: Keep ALSA sinks awake (avoid SOF DSP wake delay)
  ansible.builtin.copy:
    dest: /etc/wireplumber/wireplumber.conf.d/50-keep-alsa-awake.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      monitor.alsa.rules = [
        {
          matches = [
            { node.name = "~alsa_output.*" }
          ]
          actions = {
            update-props = {
              session.suspend-timeout-seconds = 0
            }
          }
        }
      ]
  become: true
  when: install_desktop_extras | default(true)
  # Picked up automatically on next login; no handler needed for a fresh
  # workstation provisioning run.

# Install OpenH264 codecs and plugins (best-effort: package availability varies by release)
- name: Install OpenH264 codecs and plugins
  ansible.builtin.apt:
    name:
      - gstreamer1.0-libav
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
    state: present
  become: true
  failed_when: false
  when:
    - not is_container | default(false)
    - install_desktop_extras | default(true)

# Install podman only if docker is not requested
- name: Install podman if docker is not enabled
  ansible.builtin.apt:
    name: podman
    state: present
  become: true
  when: not install_docker | default(false)

# Install extra fonts. Install one-by-one with failed_when: false so a single
# missing package (e.g. removed/renamed in a newer Ubuntu) doesn't fail the
# whole playbook — fonts are optional cosmetic enhancements.
- name: Install extra fonts (best-effort)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - fonts-anonymous-pro
    - fonts-dejavu
    - fonts-dejavu-core
    - fonts-dejavu-extra
    - fonts-freefont-ttf
    - fonts-inconsolata
    - fonts-liberation
    - fonts-liberation2
    - fonts-terminus
  become: true
  failed_when: false
  when: install_desktop_extras | default(true)

# Optionally install a Nerd Font (FiraCode) for icons (starship, prompts)
- name: Check if FiraCode Nerd Font is already installed
  ansible.builtin.command:
    cmd: fc-list | grep -i "Fira Code"
  register: common_firacode_fonts
  failed_when: false
  changed_when: false
  when: install_nerd_font | default(false)

- name: Download FiraCode Nerd Font zip
  ansible.builtin.get_url:
    url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.zip"
    dest: /tmp/FiraCode.zip
    mode: '0644'
  when:
    - install_nerd_font | default(false)
    - common_firacode_fonts.rc != 0

- name: Create nerd fonts directory
  ansible.builtin.file:
    path: /usr/local/share/fonts/nerdfonts
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when:
    - install_nerd_font | default(false)
    - common_firacode_fonts.rc != 0

- name: Unarchive FiraCode Nerd Font
  ansible.builtin.unarchive:
    src: /tmp/FiraCode.zip
    dest: /usr/local/share/fonts/nerdfonts
    remote_src: true
  become: true
  register: common_firacode_unarchive
  when:
    - install_nerd_font | default(false)
    - common_firacode_fonts.rc != 0

- name: Refresh font cache
  ansible.builtin.command:
    cmd: fc-cache -f -v
  become: true
  when:
    - install_nerd_font | default(false)
    - common_firacode_unarchive.changed | default(false)
  changed_when: true

# Uninstall unwanted apps
- name: Uninstall junk apps
  ansible.builtin.apt:
    name:
      - firefox
      - thunderbird
      - libreoffice-core
      - libreoffice-common
      - libreoffice-writer
      - libreoffice-calc
      - libreoffice-impress
      - libreoffice-draw
      - libreoffice-base-core
      - libreoffice-math
      - gnome-calendar
      - gnome-contacts
      - gnome-maps
      - rhythmbox
      - totem
      - vlc
      - gnome-tour
      - gnome-logs
    state: absent
    purge: true
    autoremove: true
  become: true
  failed_when: false
  when: install_desktop_extras | default(true)

# Ubuntu ships Firefox and Thunderbird as snaps; the apt remove above is a
# no-op for those, so shadow their .desktop files with NoDisplay overrides
# in the user's local applications directory. Harmless if a name doesn't
# resolve to anything system-wide.
- name: Ensure user applications directory exists
  ansible.builtin.file:
    path: /home/{{ local_user }}/.local/share/applications
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0755"
  become: true
  when: install_desktop_extras | default(true)

- name: Hide Firefox and Thunderbird launchers from GNOME Shell
  ansible.builtin.copy:
    dest: "/home/{{ local_user }}/.local/share/applications/{{ item }}"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      NoDisplay=true
      Hidden=true
  loop:
    - firefox.desktop
    - firefox_firefox.desktop
    - firefox-esr.desktop
    - thunderbird.desktop
    - thunderbird_thunderbird.desktop
  when: install_desktop_extras | default(true)
