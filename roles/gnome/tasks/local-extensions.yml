---
# Install + enable hand-written ("local") GNOME Shell extensions whose source
# trees live in roles/gnome/files/local-extensions/<uuid>/ (not on
# extensions.gnome.org). Skipped silently in containers and on machines
# without GNOME Shell.

- name: Ensure user gnome-shell extensions dir exists
  ansible.builtin.file:
    path: "/home/{{ local_user }}/.local/share/gnome-shell/extensions"
    state: directory
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: '0755'
  become: true
  tags: [gnome, extensions, local-extensions]

- name: Sync local extension source trees
  ansible.builtin.copy:
    src: "local-extensions/{{ item }}/"
    dest: "/home/{{ local_user }}/.local/share/gnome-shell/extensions/{{ item }}/"
    owner: "{{ local_user }}"
    group: "{{ local_user }}"
    mode: preserve
    directory_mode: '0755'
  become: true
  loop: "{{ gnome_local_extensions | default([]) }}"
  tags: [gnome, extensions, local-extensions]

- name: Detect schemas dir for each local extension
  ansible.builtin.stat:
    path: "/home/{{ local_user }}/.local/share/gnome-shell/extensions/{{ item }}/schemas"
  register: gnome_local_ext_schemas
  loop: "{{ gnome_local_extensions | default([]) }}"
  tags: [gnome, extensions, local-extensions]

- name: Compile gschemas for local extensions
  ansible.builtin.command: "glib-compile-schemas /home/{{ local_user }}/.local/share/gnome-shell/extensions/{{ item.item }}/schemas"
  become: true
  become_user: "{{ local_user }}"
  loop: "{{ gnome_local_ext_schemas.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists | default(false)
  changed_when: true
  tags: [gnome, extensions, local-extensions]

- name: Enable local extensions (best-effort, requires active user session)
  ansible.builtin.shell: |
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
    gnome-extensions enable {{ item }}
  become: true
  become_user: "{{ local_user }}"
  loop: "{{ gnome_local_extensions | default([]) }}"
  when: not is_container | default(false)
  changed_when: false
  failed_when: false
  tags: [gnome, extensions, local-extensions]
