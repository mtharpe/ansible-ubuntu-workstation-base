---
# WSL provisioning — same roles as the full workstation minus the gnome role,
# since WSL has no GNOME session. Hardware/desktop-only tasks in the common
# role auto-skip on WSL via the `is_wsl` fact set in roles/common/tasks/main.yml.
- name: Setup WSL
  hosts: workstation
  become: true
  gather_facts: true

  vars_files:
    - vars/vars.yml

  roles:
    - common
    - third-party

  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml
