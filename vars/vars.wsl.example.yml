---
# Sane defaults for provisioning a WSL Ubuntu instance. Copy to vars.yml
# (which is gitignored) and tweak. Edit THIS file only to change the
# tracked defaults, not for one-off local preferences.
#
# Usage:
#   cp vars/vars.wsl.example.yml vars/vars.yml
#   ./run_wsl.sh
#
# Hardware/desktop tasks in the common role auto-skip on WSL via the
# `is_wsl` fact — no toggle needed for zram, fstrim, ufw, or fail2ban.

# User
local_user: tharpem
local_user_email: mtharpe@noemail.not

# Services — pointless on WSL, auto-skipped by is_wsl guards anyway
enable_fail2ban: false
enable_sshd: false
local_network: ""

# Extras
install_printers: false

# Skip GUI apps, GNOME config tools, hw video accel, media codecs, ALSA
# tuning, and Firefox/Thunderbird launcher hiding — all no-ops on WSL.
install_desktop_extras: false

# Third party — GUI apps off, CLI tools on. Windows hosts Chrome/Slack/VSCode/
# Zoom/1Password natively, so installing Linux versions inside WSL is wasted
# disk. Alacritty is likewise redundant next to Windows Terminal.
install_chrome: false
install_slack: false
install_spotify: false
install_vscode: false
install_zoom: false
install_lutris: false
install_steam: false
install_alacritty: false
install_claude_desktop: false
install_autocpu: false
install_multipass: false     # snap-only; nested virt on WSL is a bad time

install_docker: true
install_gcloud: true
install_chef: false
install_bash: false
install_fish: true
install_starship: false
install_nerd_font: true
install_eza: true
install_claude: true
install_kubectl: true

# GNOME toggles are ignored — the gnome role is not included in setup_wsl.yml.
gnome_extensions: []
gnome_local_extensions: []
gnome_custom_keybindings: []

# python3
ansible_python_interpreter: /usr/bin/python3

# Ubuntu target version
ubuntu_version: "24.04"

# Header stamped into rendered config files via `{{ ansible_managed }}`.
ansible_managed: "Ansible managed — do not edit by hand"
