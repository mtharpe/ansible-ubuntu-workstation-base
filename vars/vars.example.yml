---
# This file is the tracked sane defaults for the playbook.
#
# On a fresh checkout: `cp vars/vars.example.yml vars/vars.yml` and edit
# vars/vars.yml for your personal toggles — it's gitignored.
#
# Edit THIS file (vars.example.yml) only when you want to change the defaults
# that ship in the repo, not for one-off local preferences.

# User
local_user: tharpem
local_user_email: mtharpe@noemail.not

# Services
enable_fail2ban: true
enable_sshd: false

# Subnet exempted from fail2ban (e.g. "192.168.1.0/24"). Empty = loopback only.
local_network: ""

# Extras
install_printers: true

# Third party
install_chrome: true
install_slack: true
install_spotify: false
install_vscode: true
install_zoom: true
install_lutris: false
install_steam: false
install_docker: false
install_gcloud: false
install_chef: false
install_autocpu: false
install_alacritty: true
install_bash: false
install_fish: true
install_starship: false
install_nerd_font: true
install_eza: true
install_claude: true
install_claude_desktop: true
install_kubectl: true
install_multipass: true

# GNOME Shell extensions to install + enable. UUIDs must match
# extensions.gnome.org. Edit if any UUID needs to change.
gnome_extensions:
  - just-perfection-desktop@just-perfection
  - auto-move-windows@gnome-shell-extensions.gcampax.github.com
  - power-profile-switcher@fthx
  - auto-select-headset@krocg

# Hand-written ("local") GNOME Shell extensions whose source trees live in
# roles/gnome/files/local-extensions/<uuid>/. Synced + enabled by
# roles/gnome/tasks/local-extensions.yml.
gnome_local_extensions:
  - silent-cycle-current-app@local
  - chrome-pwa-grouper@local

# Custom GNOME keyboard shortcuts, reproduced on every run so a fresh install
# matches your existing setup. Each entry maps a key binding to a command.
# The screenshot entries call helper scripts the gnome role installs to
# ~/.local/bin (they capture to the Wayland clipboard via wl-copy). Leave the
# list empty to skip custom shortcuts entirely.
gnome_custom_keybindings:
  - name: "1Password Quick Access"
    binding: "<Shift><Control>space"
    command: "/usr/bin/1password --quick-access"
  - name: "Open File Manager"
    binding: "<Super>e"
    command: "nautilus --new-window"
  - name: "Area Screenshot (to clipboard)"
    binding: "<Shift><Alt>4"
    command: "/home/{{ local_user }}/.local/bin/area-screenshot-clip"
  - name: "Fullscreen Screenshot (to clipboard)"
    binding: "<Shift><Alt>3"
    command: "/home/{{ local_user }}/.local/bin/fullscreen-screenshot-clip"

# python3
ansible_python_interpreter: /usr/bin/python3

# Ubuntu target version (used for pinning images / docs)
ubuntu_version: "24.04"

# Header stamped into rendered config files via `{{ ansible_managed }}`.
# Replaces the deprecated DEFAULT_MANAGED_STR setting in ansible.cfg.
ansible_managed: "Ansible managed — do not edit by hand"
